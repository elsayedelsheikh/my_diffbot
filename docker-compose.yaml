# Docker Compose file for TurtleBot Behavior Examples
#
# Usage:
#
# To build the images:
#   docker compose build
#
# To start up a specific service by name:
#   docker compose up <service_name>
#
# To open an interactive shell to a running container:
#   docker exec -it dev bash

services:
  # Base image containing dependencies
  base:
    image: merlin:base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
      target: base
    # Interactive shell
    stdin_open: true
    tty: true
    # Networking and IPC for ROS 2
    network_mode: host
    ipc: host
    # Needed to display graphical applications
    privileged: True

  # Overlay image containing the example source code.
  overlay:
    extends: base
    image: merlin:overlay
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: overlay

  # Developer container
  dev:
    extends: overlay
    image: merlin:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        - UID=${UID:-1000}
        - GID=${UID:-1000}
        - USERNAME=${USERNAME:-devuser}
    volumes:
      # Mount the source code
      - ./merlin_bringup:/overlay_ws/src/merlin_bringup:rw
      - ./merlin_description:/overlay_ws/src/merlin_description:rw
      - ./merlin_hardware_interface:/overlay_ws/src/merlin_hardware_interface:rw
      - ./merlin_localization:/overlay_ws/src/merlin_localization:rw
      - ./merlin_navigation:/overlay_ws/src/merlin_navigation:rw
      # Mount colcon build artifacts for faster rebuilds
      - ./.colcon/build/:/overlay_ws/build/:rw
      - ./.colcon/install/:/overlay_ws/install/:rw
      - ./.colcon/log/:/overlay_ws/log/:rw
      # Live /dev so /dev/lidar and /dev/ttyACM0 survive a replug
      # or an ESP32 reset; a bind of a missing symlink would create a directory.
      - /dev:/dev:rw
      - ./docker/cyclonedds.xml:/cyclonedds.xml:ro
    environment:
        ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
        RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        CYCLONEDDS_URI: file:///cyclonedds.xml
    user: root
    command: sleep infinity

  build-ws:
    extends: dev
    command: colcon build --symlink-install

  robot-bringup:
    extends: dev
    restart: unless-stopped          # preserves boot/restart behavior (with docker enabled)
    command: ros2 launch merlin_bringup bringup_robot.launch.py mcu_serial_port:=/dev/ttyACM0

  # Mapping: run with robot-bringup, drive with teleop, then save from any shell:
  #   ros2 run nav2_map_server map_saver_cli -f /overlay_ws/src/merlin_navigation/maps/<name>
  slam:
    extends: dev
    command: ros2 launch merlin_navigation slam.launch.py

  # Navigate on the live slam map (alongside `slam`), or on a saved map with AMCL:
  #   MAP=/overlay_ws/src/merlin_navigation/maps/<name>.yaml docker compose up navigation
  navigation:
    extends: dev
    command: ros2 launch merlin_navigation navigation.launch.py map:=${MAP:-}

  teleop-keyboard:
    extends: dev
    command: ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true

  test-controllers:
    extends: dev
    command: ros2 launch merlin_bringup robot_controllers.launch.py

  test-lidar:
    extends: dev
    command: ros2 launch merlin_bringup lidar_bringup.launch.py

  foxglove-visualize:
    extends: dev
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml

  # Lean bridge for the Android app (port 8766); see merlin_bringup/config/foxglove_app.yaml.
  foxglove-app:
    extends: dev
    restart: unless-stopped
    command: >-
      ros2 run foxglove_bridge foxglove_bridge --ros-args -r __node:=foxglove_bridge_app
      --params-file /overlay_ws/src/merlin_bringup/config/foxglove_app.yaml

  # BLE provisioning for the Android app (merlin_bluetooth/README.md). Set MERLIN_BT_PIN
  # (6-12 digits) in .env; the app asks for it once.
  bluetooth:
    image: merlin:bluetooth
    build:
      context: .
      dockerfile: docker/Dockerfile.bluetooth
    restart: unless-stopped
    network_mode: host
    pid: host          # nsenter runs the host's nmcli/iw (matches its NetworkManager 1.22)
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus      # host bluetoothd
      - /etc/merlin:/etc/merlin:ro       # camera viewer password (merlin_camera_streamer)
      - ./merlin_bluetooth:/overlay_ws/src/merlin_bluetooth:ro
      - ./docker/cyclonedds.xml:/cyclonedds.xml:ro
    environment:
      MERLIN_BT_PIN: ${MERLIN_BT_PIN:?set MERLIN_BT_PIN (6-12 digits) in .env}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: file:///cyclonedds.xml
