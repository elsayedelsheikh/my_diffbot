controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    my_diffbot_base_controller:
      type: diff_drive_controller/DiffDriveController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    led_controller:
      type: gpio_controllers/GpioCommandController

    roboauto_tuning_controller:
      type: gpio_controllers/GpioCommandController

    # my_range_sensor_broadcaster:
    #   type: range_sensor_broadcaster/RangeSensorBroadcaster

my_diffbot_base_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.285
    wheels_per_side: 1
    wheel_radius: 0.031
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    position_feedback: true
    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 5.0
    publish_limited_velocity: true
    velocity_rolling_window_size: 15
    linear.x.max_velocity: 0.5
    angular.z.max_velocity: 1.5
    linear.x.max_acceleration: 1.0
    angular.z.max_acceleration: 2.0

imu_broadcaster:
  ros__parameters:
    sensor_name: 'bno055_imu'
    frame_id: 'imu_link'
    static_covariance_orientation: [0.0159, 0.0, 0.0, 0.0, 0.0159, 0.0, 0.0, 0.0, 0.0159]
    static_covariance_angular_velocity: [0.04, 0.0, 0.0, 0.0, 0.04, 0.0, 0.0, 0.0, 0.04]
    static_covariance_linear_acceleration: [0.017, 0.0, 0.0, 0.0, 0.017, 0.0, 0.0, 0.0, 0.017]

# Onboard RGB LED: led_mode 0 off, 1 solid, 2 blink, 3 alternate; colours are 0xRRGGBB.
led_controller:
  ros__parameters:
    gpios:
      - led
    command_interfaces:
      led:
        - interfaces:
          - led_mode
          - led_color
          - led_color_alt
          - led_period_ms
    state_interfaces:
      led:
        - interfaces:
          - led_mode
          - led_color
          - led_color_alt
          - led_period_ms

# Live PID (x1000) and motor watchdog re-tuning; sent to the MCU only on change.
roboauto_tuning_controller:
  ros__parameters:
    gpios:
      - roboauto_pid
      - roboauto_watchdog
    command_interfaces:
      roboauto_pid:
        - interfaces:
          - kp_l
          - ki_l
          - kd_l
          - kp_r
          - ki_r
          - kd_r
      roboauto_watchdog:
        - interfaces:
          - cmd_timeout_ms

